defaults:
  - _self_
  - optional experiment: null

seed: 42
device: auto

data:
  mode: streaming
  # Used only when mode=static.
  path: data/activations
  key: activations
  statistics_path: data/gpt2_layer_5_statistics.pt
  val_fraction: 0.1
  num_workers: 0
  streaming:
    dataset_name: Skylion007/openwebtext
    dataset_config: null
    split: train
    text_column: text
    model_name: gpt2
    tokenizer_name: gpt2
    model_dtype: auto
    trust_remote_code: false
    # AutoModel(gpt2) exposes its blocks as h[0..11].
    layer_path: h
    layer_index: 5
    max_length: 1024
    text_batch_size: 8
    shuffle_buffer_size: 10000
    validation_texts: 1024

model:
  hidden_size: null
  # GPT hidden_size is fixed by the source; latent_dim is the MLP bottleneck.
  latent_dims: [192, 768, 3072]
  num_layers: [1, 3, 5]
  sigmas: [0.1, 0.2, 0.5]

training:
  epochs: 1
  max_steps: 10000
  batch_size: 512
  learning_rate: 0.0001
  weight_decay: 0.01
  betas: [0.9, 0.95]
  max_grad_norm: 1.0
  precision: bf16
  log_every_batches: 10
  validation_every_batches: 100
  validation_batches: 50

wandb:
  enabled: true
  project: steering-recovery
  name: null
  entity: null
  mode: online
  tags: [denoiser]

hydra:
  job:
    chdir: false
  run:
    dir: runs/denoiser/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: runs/denoiser-sweeps/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}_${hydra.job.override_dirname}
