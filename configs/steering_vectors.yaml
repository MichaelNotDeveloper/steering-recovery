generator: ag_news
seed: 42
device: auto

dataset:
  name: sh0416/ag_news
  config: null
  split: train
  # The dataset stores the headline separately; the article body is description.
  text_column: description
  label_column: label
  streaming: false
  shuffle: true
  shuffle_buffer_size: 10000
  max_rows: null

source:
  model_name: gpt2
  tokenizer_name: gpt2
  # The topic means must be estimated from full-precision GPT-2 hidden states.
  model_dtype: float32
  trust_remote_code: false
  # AutoModel(gpt2) exposes transformer blocks as h[0] ... h[11].
  layer_path: h
  layer_index: 5

extraction:
  # Default: no prompt; collect h[5] for every token of each article body.
  # Use prompt_last_token to reproduce the earlier "... mainly about" method.
  mode: full_text_all_tokens
  # GPT-2 Small context limit. AG News descriptions normally fit completely.
  max_length: 1024

# Used only when extraction.mode=prompt_last_token.
prompt:
  prefix: "Article: "
  suffix: "\nThis article is mainly about"
  article_tokens: 48
  expected_last_token: about

collection:
  # Article quota. The number of collected hidden states is the token count.
  samples_per_topic: 1000
  batch_size: 32

output_dir: data/steering_vectors/ag_news/gpt2_layer_${source.layer_index}

hydra:
  job:
    chdir: false
  run:
    dir: runs/steering-vectors/${now:%Y-%m-%d}/${now:%H-%M-%S}
