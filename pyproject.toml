[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "steering-recovery"
version = "0.1.0"
description = "Activation-steering baselines and a trainable hidden-state denoiser"
requires-python = ">=3.10"
dependencies = [
    "datasets>=3.0",
    "hydra-core>=1.3,<1.4",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "omegaconf>=2.3,<2.4",
    "safetensors>=0.4",
    "torch>=2.2",
    "tqdm>=4.66",
    "transformers>=4.47",
    "wandb>=0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
include = ["steering_recovery*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
